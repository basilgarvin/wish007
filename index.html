<script>
const S=[];
function add(o){S.push(o)}
// Opening
add({type:'opening'});
add({chapter:'Chapter 1',type:'chapter-start',title:'CHAPTER ONE',subtitle:'FIRST MEETING',text:'It started with one ordinary day…'});
// Chapter 1
add({chapter:'Chapter 1',type:'scene',mood:'warm',head:'THE CAR',img:'CarScene.jpg',sketch:true,text:`It wasn't planned.\nI was going to the function on my bike.\nThere was a car in front of me… but I had no idea where it was going.\nI wasn't following it. We just happened to be going the same way.\nThen suddenly… the car stopped.\nI was right behind it, thinking whether to honk.\nThe back-right door opened.\nAnd there you were.\nRed dress. Jimki.\nI recognized you immediately.\nI smiled from the bike.\nYou didn't notice me then.`});
add({chapter:'Chapter 1',type:'scene',mood:'warm',head:'INSIDE',text:`I parked the bike and went inside.\nNothing dramatic happened next.\nWe didn't immediately start talking.\nIt was just a normal family function.`});
add({chapter:'Chapter 1',type:'scene',mood:'warm',head:'FOOD PASS',img:'FoodPass.jpg',sketch:true,text:`After the function, the food was being served.\nAda, puttu, pathiri, kadala, chicken curry, pappadam… everything was moving through a little human line.\nYou were standing there watching.\nThen I said…` ,quote:'“Veruthe nokki nikkathe vannu pani edukkadee.”'});
add({chapter:'Chapter 1',type:'scene',mood:'warm',head:'TOGETHER',img:'FoodWork.jpg',sketch:true,text:`A couple of minutes later, maman called me to the front to fill the covered containers with puttu, pathiri and the other food items.\nI called you too.\nAnd somehow… we ended up working together.\nNothing dramatic. Nothing planned.\nWe were just… happy doing it together.`});
add({chapter:'Chapter 1',type:'scene',mood:'warm',head:'ONE TABLE',img:'OneTable.jpg',sketch:true,text:`After that, everyone sat together in a room and ate.\nYou were barely eating.\n“Entha ithra kurach kazhikkunne?”\n“Ente kunju vayaru.” 😂\n“Lachimi ithilum kooduthal kayikumalooo.” 😂\nThen the teasing started.\nJust one of those comfortable family moments.`});
add({chapter:'Chapter 1',type:'scene',mood:'soft',head:'YOUR NAME',text:`I suddenly realized… I had forgotten your name. 😭\nYou remembered my name and Akash's.\n“Dhanisha.”\n“Ohh Dhanisha aanalle… variety name aanallo.”`,big:'DHANISHA'});
add({chapter:'Chapter 1',type:'scene',mood:'soft',head:'INSTAGRAM',img:'Instagram.jpg',sketch:true,text:`Later, you asked about my Instagram.\nThe old account was gone. I had another one, but I had stopped using Instagram for a while.\nYou told me to follow you.\nYour phone wasn't even with you that day — it was at home charging.\n“Njan veettil chennittu follow cheyyam.”\nAnd that little conversation became important later.`});
add({chapter:'Chapter 1',type:'scene',mood:'night',head:'GOODBYE',img:'Goodbye.jpg',sketch:true,text:`You teased me.\nI teased you.\nThen you playfully hit me on the stomach. 😂\nBefore leaving:\n“Msg ayakkamto…”\nInstagram.\nThat was enough.`});
add({chapter:'Chapter 1',type:'scene',mood:'night',head:'THAT NIGHT',img:'ThatNight.jpg',sketch:true,text:`You reached home.\nAn Instagram follow request came in.\nI accepted.\nA few messages.\nThen… Good night.`});
add({chapter:'Chapter 1',type:'chapter-end',title:'CHAPTER ONE',subtitle:'FIRST MEETING',text:`Maybe it was just a normal day.\nI didn't know it was the beginning of something.\n\nSome stories begin without us noticing.`});
add({chapter:'Chapter 2',type:'chapter-start',title:'CHAPTER TWO',subtitle:'THE ONLINE DAYS',text:'After the first meeting… the story continued through messages.'});
// Chapter 2
add({chapter:'Chapter 2',type:'scene',head:'ONLINE DAYS',img:'OnlineChat.jpg',sketch:true,text:`After that first meeting… we didn't meet much in person.\nMost of what came next happened through messages.\nSmall conversations. Random talks. Slowly getting comfortable.`});
add({chapter:'Chapter 2',type:'scene',head:'PRODUCTIVE',img:'DrawingPhoto.jpg',sketch:true,text:`I was into workouts, health and staying active.\nAnd I kept telling you to be productive too. 😂\nThen I started sending you photos and asking you to draw something on them.`});
add({chapter:'Chapter 2',type:'scene',head:'TWO DAYS',text:`And you actually did.\nFor two days. 😂\nI was genuinely so happy seeing them.\nThen…\n“Ini njan varakkilla.”\n“Ini onnum cheyyilla.” 😂\nAnd just like that… my little productive project was cancelled. 😭\nBut those tiny things were slowly becoming memories.`});
add({chapter:'Chapter 2',type:'chapter-end',title:'CHAPTER TWO',subtitle:'THE ONLINE DAYS',text:`Some stories grow quietly.\nSometimes through nothing more than messages and little things.`});
add({chapter:'Chapter 3',type:'chapter-start',title:'CHAPTER THREE',subtitle:'THE CHANGE',text:'Some changes happen quietly.'});
// Chapter 3
add({chapter:'Chapter 3',type:'scene',head:'BEFORE',img:'DarkToLight.jpg',sketch:true,text:`There was a time when I had stepped away from almost everything.\nInstagram.\nWhatsApp.\nBeing online.\nSometimes I'd stay offline for a day or two.\nI was spending a lot of time alone.\nThinking.\nOverthinking.`});
add({chapter:'Chapter 3',type:'scene',head:'SLOWLY',text:`And then… somehow…\nI started coming back online.\nInstagram first. Mostly because I wanted to message you.\nThen WhatsApp slowly became active too.\nNot suddenly. Not all at once. Just slowly.`});
add({chapter:'Chapter 3',type:'scene',head:'A LITTLE LIGHT',text:`A little light came in.\nSometimes a person doesn't change your whole life.\nSometimes… they just make it feel a little less dark.`});
add({chapter:'Chapter 3',type:'chapter-end',title:'CHAPTER THREE',subtitle:'THE CHANGE',text:`Not a rescue story.\nJust a small shift… that mattered.`});
add({chapter:'Chapter 4',type:'chapter-start',title:'CHAPTER FOUR',subtitle:'THE 16-YEAR-OLD LIE',text:'And then came one very questionable answer. 😂'});
// Chapter 4
add({chapter:'Chapter 4',type:'scene',head:'THE 16-YEAR-OLD LIE 😂',img:'Investigation.jpg',sketch:true,text:`During one of our Instagram chats, I casually asked you:\n“Ethra vayassayi?”\nAnd you simply said… “16.” 😌\nI wasn't asking for any special reason. Just wanted to know your age.\nThen you asked mine.\n“21.”\n“Okay.” 😂`});
add({chapter:'Chapter 4',type:'scene',head:'THEN THE MATH STARTED',text:`Later, while we were talking about family and people we knew, you mentioned your chechi — the relative I already knew — and said you two were the same age.\n\nAbout two days later I asked again:\n“Ninakku 16 vayassalle?”\n“Ninakku 16 vayassu thanne alle?”\n\nBut something wasn't adding up.\nYou had completed your degree. You were waiting for two improvement exams. And Akash was already 17+ / nearing 18.`});
add({chapter:'Chapter 4',type:'scene',head:'CAUGHT. KAIYODE. 😂',img:'CaseClosed.jpg',sketch:true,text:`One thing after another… the story started contradicting itself.\nSo I finally put all those little details together.\nAnd you had to admit it.\n\n“Sheriya, enikku 16 vayassalla… enikku 20 vayassaanu.”\n\nHonestly… the funniest part wasn't even the lie. It was how confidently you kept the story going before finally getting caught. 😂`});
add({chapter:'Chapter 4',type:'scene',head:'THE END OF THE INVESTIGATION',big:'CASE CLOSED 😂',text:''});
add({chapter:'Chapter 4',type:'chapter-end',title:'CHAPTER FOUR',subtitle:'THE 16-YEAR-OLD LIE',text:`A very confident story.\nA very questionable timeline. 😂`});
add({chapter:'Chapter 5',type:'chapter-start',title:'CHAPTER FIVE',subtitle:'SOMEWHERE IN BETWEEN',text:'Somewhere between the little things…'});
// Chapter 5
add({chapter:'Chapter 5',type:'scene',head:'UNDAKANNY',img:'Undakanny.jpg',sketch:true,text:`One random 👀 emoji… somehow became a nickname.\nThat was the moment I started calling you…` ,big:'UNDAKANNY'});
add({chapter:'Chapter 5',type:'scene',head:'VAALMAKRIYE',img:'Vaalmakriye.jpg',sketch:true,text:`And your nickname for me?\nDuring my long-hair phase, you noticed how long I'd grown my hair… and gave me a name too.` ,big:'VAALMAKRIYE'});
add({chapter:'Chapter 5',type:'scene',head:'SAME VIBE',img:'FutureTalk.jpg',sketch:true,text:`Somewhere along the way, we started talking about the future too.\nWhat kind of person each of us wanted.\nWhat matters. What doesn't.\nAnd somehow… the answers sounded surprisingly similar.\n\nUnderstanding.\nLove.\nCare.\nFamily.\n\nDifferent words maybe. But somehow… the same vibe.`});
add({chapter:'Chapter 5',type:'scene',head:'FOOD & CARE',img:'FoodCare.jpg',sketch:true,text:`And yes… I still had one very important responsibility. 😂\nMaking sure you eat properly.\nSometimes you didn't eat enough. Sometimes you didn't eat on time. And I'd irritate you about it.\nNot because I wanted to annoy you. Just because… I cared.`});
add({chapter:'Chapter 5',type:'chapter-end',title:'CHAPTER FIVE',subtitle:'SOMEWHERE IN BETWEEN',text:`Somewhere between nicknames, future talks and little reminders…\nwe became a little more comfortable with each other.`});
add({chapter:'Chapter 6',type:'chapter-start',title:'CHAPTER SIX',subtitle:'FIVE SONGS',text:'Some memories sound better when you remember them.'});
// Chapter 6
add({chapter:'Chapter 6',type:'scene',head:'THE CALL',img:'SongCall.jpg',sketch:true,text:`There was one day… songs became more than just songs.\nA call. A guessing-game kind of moment.`});
add({chapter:'Chapter 6',type:'scene',head:'YOUR VOICE',img:'Singing.jpg',sketch:true,text:`Then another day… you sang for me.\nNot one song. Not two.\nHearing you sing in your own voice… that was something else.`});
add({chapter:'Chapter 6',type:'scene',head:'THE MEMORY',text:`Five songs.\nOne little memory I know I'll remember.`});
add({chapter:'Chapter 6',type:'scene',head:'THE LAST PART',img:'Five.jpg',sketch:true,text:`Five songs.` ,big:'FIVE'});
add({chapter:'Chapter 6',type:'chapter-end',title:'CHAPTER SIX',subtitle:'FIVE SONGS',text:`Some moments stay because of what was said.\nSome stay because of what you heard.`});
add({chapter:'Chapter 7',type:'chapter-start',title:'CHAPTER SEVEN',subtitle:'THE IGNORE',text:'One small misunderstanding. A lot of feelings.'});
// Chapter 7
add({chapter:'Chapter 7',type:'scene',head:'THE IGNORE',img:'ReelsIgnore.jpg',sketch:true,text:`I was under work pressure.\nWhile I was messaging you… you were watching reels.\nYou told me you were watching reels while I was messaging.\nI felt bad. Angry. Sad.\n“Nee reels noki irunno njan povaan.”\nAnd I went offline.`});
add({chapter:'Chapter 7',type:'scene',head:'THE VOICE NOTE',img:'VoiceNote.jpg',sketch:true,text:`You got angry too.\n“Pokko.”\n“Aarum aareyum pidich nirthanilla.”\n“Povandavark pokaam.”\n\nThe next day, you sent me a voice message.\nYou told me that after saying “pokko” and seeing me actually leave, you felt bad, felt sad, and even got tears in your eyes… before wondering why you were crying while you were still watching reels.`});
add({chapter:'Chapter 7',type:'scene',head:'MAKING UP',img:'MakeUp.jpg',sketch:true,text:`We figured it out.\nWe apologized.\nThere were many voice messages and calls after that.\n\nThen came the Kottayam days… and eventually I came back home.\nThat same day, you told me you were coming to town for admission — to study to become a teacher.`});
add({chapter:'Chapter 7',type:'chapter-end',title:'CHAPTER SEVEN',subtitle:'THE IGNORE',text:`Sometimes even a small misunderstanding shows you how much a connection matters.`});
add({chapter:'Chapter 8',type:'chapter-start',title:'CHAPTER EIGHT',subtitle:'THE SECOND MEETING',text:'07 July 2026 — another unexpected meeting.'});
// Chapter 8
add({chapter:'Chapter 8',type:'scene',mood:'green',head:'07 JULY 2026',img:'SecondMeeting.jpg',sketch:true,text:`You unexpectedly asked if I was coming to town.\nYou were going for admission.\nI immediately got ready — even without eating — and rode my bike to meet you.\nOn the way, I bought Puli Mittayi because you had once told me you liked it.\nThen I learned your friend would be there too, so I bought two Munch bars.`});
add({chapter:'Chapter 8',type:'scene',mood:'green',head:'HER THAT DAY',img:'GreenDress.jpg',sketch:true,vertical:true,text:`Green dress.\nThe same overall design as the red-dress reference.\nJust… green this time.`});
add({chapter:'Chapter 8',type:'scene',mood:'green',head:'THE JIMKI',img:'Jimki.jpg',sketch:true,detail:true,text:`The same jimki detail I noticed.`});
add({chapter:'Chapter 8',type:'scene',mood:'green',head:'THE POTTU',img:'Pottu.jpg',sketch:true,detail:true,text:`That small black dot pottu.`});
add({chapter:'Chapter 8',type:'scene',mood:'green',head:'THE KURI',img:'Kuri.jpg',sketch:true,detail:true,text:`The short kuri.`});
add({chapter:'Chapter 8',type:'scene',mood:'green',head:'THE HAIR',img:'Hair.jpg',sketch:true,detail:true,text:`Softly flowing, open hair.`});
add({chapter:'Chapter 8',type:'scene',mood:'green',head:'THE WATCH',img:'Watch.jpg',sketch:true,detail:true,text:`That simple silver bracelet-style watch.`});
add({chapter:'Chapter 8',type:'scene',mood:'green',head:'ALL THOSE LITTLE DETAILS',img:'HerThatDay.jpg',sketch:true,vertical:true,text:`Dress. Jimki. Pottu. Kuri. Hair. Watch.\n\nMaybe because I was actually paying attention.`});
add({chapter:'Chapter 8',type:'scene',mood:'green',head:'PULI MITTAYI',img:'PuliMittayi.jpg',sketch:true,text:`You first got the Munch.\nThen I said…\n“Oru saadhanam ninakk vendi konduvannittund.”\n\nI reached into my pocket… and took them all out together.\nTen little packets.\nBecause you had once told me you liked them.\nI remembered.`});
add({chapter:'Chapter 8',type:'scene',mood:'green',head:'A LITTLE DRAWING',img:'SecondMeetingDrawing.jpg',photo:true,text:`Two days later, during a call… you sent me a little drawing.\nSomething from that day.\nYou had remembered it.\nAnd turned it into something of your own.\n\n11 July 2026.`});
add({chapter:'Chapter 8',type:'chapter-end',title:'CHAPTER EIGHT',subtitle:'THE SECOND MEETING',text:`One ordinary day.\nA lot of little things I somehow still remember.`});
add({chapter:'Chapter 9',type:'chapter-start',title:'CHAPTER NINE',subtitle:'LITTLE THINGS',text:'The little things were starting to mean more.'});
// Chapter 9
add({chapter:'Chapter 9',type:'scene',head:'WHITE DRESS 🤍',img:'WhiteDress.jpg',photo:true,vertical:true,text:`Some pictures just make you stop for a second. 🤍`});
add({chapter:'Chapter 9',type:'scene',head:'SAREE ❤️',img:'Saree1.jpg',photo:true,vertical:true,text:`And yeah…\nI really like you in saree. 😌`});
add({chapter:'Chapter 9',type:'scene',head:'THAT VIDEO',img:'CrushMom.mp4',video:true,text:`Some pictures just stay with you.\nYou sent me this video…\nAnd honestly?\nEnik ninne onnude crush adichu. 😌\nI even told you that. 😂`});
add({chapter:'Chapter 9',type:'chapter-end',title:'CHAPTER NINE',subtitle:'LITTLE THINGS',text:`Sometimes it's the smallest things that stay the longest.`});
// Unexpected
add({type:'scene',head:'THE UNEXPECTED PART ❤️',img:'Unexpected.jpg',sketch:true,text:`I never really planned for you to become such an important part of my life.\nYou just happened.\nSomewhere between all the conversations, the little fights, the silly moments, the laughs, and everything in between… we became us.\n\nAnd honestly… I don't feel like letting that bond go.\nYou're one of those unexpected things life brought to me.\nSomething I never went looking for… but somehow became one of my favourite parts of it.\n\nYou made me understand little things about love, care, giving, and simply being there for someone.\nNot through big words. Just through the little things.\n\nI don't know exactly what the future holds.\nBut I know one thing…` ,big:"I’m really glad you happened."});
// Birthday
add({type:'scene',head:'A LITTLE WISH',mood:'warm',text:`After everything I wanted to tell you…\nthere's just one thing I want for you.`,big:'Be happy.\nBe safe. 🌼🦋🫂✨'});
add({type:'scene',head:'FOR YOU',mood:'warm',text:`I know you can't be happy all the time.\nLife won't always be easy, and some days will feel heavier than others.\n\nBut whenever you can…\ntry to choose happiness.\nTry to smile.\nKeep going.\n\nAnd whenever you feel like you can't handle something alone—\nfeel free.\n\nI'm always here for you.\n\nI love what you are.\nSo don't ever feel like you have to become someone else to be enough.\n\nKeep going, my love.\nEverything will be fine. ❤️`});
add({type:'scene',head:'HAPPY BIRTHDAY',mood:'warm',text:`Happy Birthday, Dhanieeee. 🎂🌼\n\nI'm really glad you happened to me.` ,big:'Happy Birthday, Dhanieeee. 🎂🌼'});
add({type:'scene',head:'ONE SMALL SORRY',mood:'night',text:`And one small sorry… for being a little late with this. 🫂\n\nI started putting this together on 9 September, and somehow it took until 21 September to finally bring everything together.\n\nIt may be late… but every bit of it was made with you in mind. ❤️`});
// End credits
add({type:'credits',head:'END CREDITS'});
add({type:'end',head:'THE END'});

let idx=0, unlocked=false, timers=[];
const app=document.getElementById('app');
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function screenHtml(o,i){

app.innerHTML=S.map(screenHtml).join('');
const total=S.length;
function nav(){document.querySelectorAll('.nav,.counter').forEach(x=>x.remove()); if(idx===0)return; const nav=document.createElement('div');nav.className='nav';nav.innerHTML=`<button class="btn" id="prev" ${idx<=1?'disabled':''}>Previous</button><button class="btn" id="next">${idx===total-1?'Finish':'Next'}</button>`;document.body.appendChild(nav);const c=document.createElement('div');c.className='counter';c.textContent=`${String(idx).padStart(2,'0')} / ${String(total-1).padStart(2,'0')}`;document.body.appendChild(c);document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('next').onclick=()=>go(idx+1)}
function go(n){if(!unlocked&&n>0)return;if(n<0||n>=total)return;clearTimeouts();document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===n));idx=n;nav();const active=document.getElementById('s'+idx);const vid=active?.querySelector('video');if(vid&&vid.src.includes('CrushMom')){vid.currentTime=0;vid.play().catch(()=>{})} if(vid&&vid.src.includes('BdayBmb')){vid.currentTime=0;vid.play().catch(()=>{})}}
